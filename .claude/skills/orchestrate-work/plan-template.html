<title>Work Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: four phase columns left to right, nodes as cards, SVG arrows drawn between dependencies. */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#cfd6d0;
  --accent:#2f6f5e; --todo:#8a948d; --run:#c97a12; --done:#2f8a4f; --warn:#b3412f;
  --font-d:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1d2521; --fg:#e8eeea; --muted:#9aa59e; --line:#34403a;
  --accent:#6fc2a8; --todo:#7c8780; --run:#e8a24a; --done:#5fc27f; --warn:#e8806c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1d2521; --fg:#e8eeea; --muted:#9aa59e; --line:#34403a;
  --accent:#6fc2a8; --todo:#7c8780; --run:#e8a24a; --done:#5fc27f; --warn:#e8806c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;line-height:1.45;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:22px}
h1{font-family:var(--font-d);font-size:26px;margin:0;text-wrap:balance}
h2{font-family:var(--font-d);font-size:15px;margin:0 0 8px;letter-spacing:.02em}
.sub{color:var(--muted);margin:4px 0 0}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--done);width:0;transition:width .4s}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.graph{position:relative;overflow-x:auto;padding-bottom:6px}
.cols{position:relative;display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:34px;min-width:960px}
.col h3{font-family:var(--font-d);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.col{display:grid;gap:12px;align-content:start}
.node{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--todo);border-radius:8px;padding:9px 11px;position:relative;z-index:1}
.node b{display:block;font-weight:600;font-size:13px}
.node span{color:var(--muted);font-size:12px}
.node .tag{display:inline-block;margin-top:5px;font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--muted)}
.node.running{border-left-color:var(--run)} .node.running .tag{color:var(--run);border-color:var(--run)}
.node.done{border-left-color:var(--done)} .node.done .tag{color:var(--done);border-color:var(--done)}
.node.todo .tag{color:var(--todo)}
.node.running::after{content:"";position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--run);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}} @media (prefers-reduced-motion:reduce){.node.running::after{animation:none}}
svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
svg.links path{fill:none;stroke:var(--line);stroke-width:1.6}
svg.links path.on{stroke:var(--accent)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
ul{margin:0;padding-left:18px;display:grid;gap:5px} li{min-width:0}
.log li{list-style:none;margin-left:-18px;display:flex;gap:10px}.log time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.shots figure{margin:0;min-width:0}.shots img{width:100%;border:1px solid var(--line);border-radius:8px;display:block;background:var(--bg)}
.shots figcaption{font-size:12px;color:var(--muted);margin-top:5px}.shots b{color:var(--fg);display:block;font-size:12px}
.ub{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.ub i{display:block;height:10px;border-radius:5px;background:var(--accent)}.ub span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media(max-width:480px){.ub{grid-template-columns:100px 1fr 36px}}
</style>
<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <p class="sub">__SUBTITLE__ Agents work independently; this page is republished as steps finish.</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="meta" id="meta"></div>
  </header>
  <section class="graph"><div class="cols" id="cols"><svg class="links" id="links"></svg></div></section>
<section class="panel" id="shots"><h2>Screenshots</h2><div class="shots" id="shotgrid"></div></section>
<section class="panel" id="usage"><h2>Tokens used by helper agents (thousands)</h2><p class="sub" id="usub"></p><div id="ubars"></div></section>
  <div class="two">
    <section class="panel"><h2>Questions for the owner (ledger)</h2><ul id="qs"></ul></section>
    <section class="panel"><h2>Log</h2><ul class="log" id="log"></ul></section>
  </div>
</div>
<script>
const PHASES=["1 · Research and advice","2 · Decide and plan","3 · Build","4 · Check and ship"]; // rename or drop phases to fit; change repeat(4 in the CSS to match
// status: todo | running | done
const N=[
 {id:"r1",p:0,t:"Research A",d:"One question, one doc under docs/research/",m:"Opus",s:"done"},
 {id:"r2",p:0,t:"Research B",d:"Runs in parallel with A",m:"Sonnet",s:"done"},
 {id:"pl",p:1,t:"Synthesis and task board",d:"Decisions, tasks/NNN-*.md, question ledger",m:"Opus",s:"done",from:["r1","r2"]},
 {id:"w1",p:2,t:"Task 001",d:"Worktree task-001, touches listed",m:"Sonnet",s:"running",from:["pl"]},
 {id:"w2",p:2,t:"Task 002",d:"Disjoint touches, parallel",m:"Sonnet",s:"todo",from:["pl"]},
 {id:"qg",p:3,t:"Merge, test, build",d:"Exit codes read, personal-data scan",m:"Orchestrator",s:"todo",from:["w1","w2"]},
 {id:"sh",p:3,t:"Push and verify deploy",d:"Actions run green",m:"Orchestrator",s:"todo",from:["qg"]}
];
const QUESTIONS=[];
const LOG=[{t:"00:00",x:"Plan published (replace with the real time from current_time)."}];
const cols=document.getElementById("cols"),svg=document.getElementById("links");
const label={todo:"Waiting",running:"Working",done:"Done"};
const colEls=PHASES.map(n=>{const c=document.createElement("div");c.className="col";c.innerHTML="<h3>"+n+"</h3>";cols.appendChild(c);return c});
const els={};
N.forEach(n=>{const e=document.createElement("div");e.className="node "+n.s;e.innerHTML="<b>"+n.t+"</b><span>"+n.d+"</span><br><span class='tag'>"+label[n.s]+" · "+n.m+"</span>";colEls[n.p].appendChild(e);els[n.id]=e});
function draw(){
  svg.innerHTML="";const o=cols.getBoundingClientRect();
  N.forEach(n=>(n.from||[]).forEach(f=>{
    const a=els[f].getBoundingClientRect(),b=els[n.id].getBoundingClientRect();
    const x1=a.right-o.left,y1=a.top+a.height/2-o.top,x2=b.left-o.left,y2=b.top+b.height/2-o.top,k=(x2-x1)/2;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d","M"+x1+","+y1+" C"+(x1+k)+","+y1+" "+(x2-k)+","+y2+" "+x2+","+y2);
    if(N.find(m=>m.id===f).s==="done")p.setAttribute("class","on");svg.appendChild(p)}))}
const done=N.filter(n=>n.s==="done").length,run=N.filter(n=>n.s==="running").length;
document.getElementById("fill").style.width=Math.round((done+run*.4)/N.length*100)+"%";
document.getElementById("meta").innerHTML=
 "<span><i class='dot' style='background:var(--done)'></i>"+done+" done</span><span><i class='dot' style='background:var(--run)'></i>"+run+" working</span><span><i class='dot' style='background:var(--todo)'></i>"+(N.length-done-run)+" waiting</span>";
document.getElementById("qs").innerHTML=QUESTIONS.length?QUESTIONS.map(q=>"<li>"+q+"</li>").join(""):"<li style='list-style:none;margin-left:-18px;color:var(--muted)'>None yet. Collected as agents work.</li>";
document.getElementById("log").innerHTML=LOG.slice().sort((a,b)=>b.t.localeCompare(a.t)).map(l=>"<li><time>"+l.t+"</time><span>"+l.x+"</span></li>").join("");
addEventListener("resize",draw);document.fonts&&document.fonts.ready.then(draw);draw();

const SHOTS=[];
document.getElementById("shotgrid").innerHTML=SHOTS.map(x=>"<figure><img alt='"+x.t+"' src='"+x.u+"'><figcaption><b>"+x.t+"</b>"+x.c+"</figcaption></figure>").join("");
const USE=[["Research A",0]]; // [label, thousands of tokens] from each agent's final report
const mx=Math.max(1,...USE.map(u=>u[1]));
document.getElementById("ubars").innerHTML=USE.map(u=>"<div class='ub'><span>"+u[0]+"</span><i style='width:"+Math.round(u[1]/mx*100)+"%'></i><span>"+u[1]+"</span></div>").join("");
document.getElementById("usub").textContent="Total so far: "+USE.reduce((a,u)=>a+u[1],0)+"k tokens across helper agents. The 5-hour and 7-day plan limits are not visible to me, so this is not a quota percentage.";
</script>
