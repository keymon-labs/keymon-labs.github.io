name: Publish Claude apps to npm

# Builds claude/dist (one self-contained file per app in claude/apps.json) and publishes
# @keymon-labs/claude-apps with npm trusted publishing (OIDC, no token; provenance is automatic).
# Off until the repo variable NPM_PUBLISH is "true" (setup: .claude/skills/labs-claude-loader).
# The loader artifact is then republished from a Claude chat (see CLAUDE.md).
on:
  push:
    branches: [main]
    paths: ["claude/**", "shared/**", "homework-reader/**", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 # trusted publishing needs npm >= 11.5.1
      - run: npm ci && npm test && npm run build:claude
      - working-directory: claude
        run: |
          npm version "0.1.${{ github.run_number }}" --no-git-tag-version
          npm publish
          echo "Published @keymon-labs/claude-apps@0.1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
