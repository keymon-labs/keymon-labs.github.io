<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Quest</title>
<meta name="description" content="Write a sentence on paper, take a photo, fix the mistakes, and watch the story happen.">
<meta name="theme-color" content="#9fe0ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <header class="top">
    <button id="back" class="icon" type="button" aria-label="Back" hidden>←</button>
    <h1 id="title" data-t="title">Word Quest</h1>
    <span id="coins" class="coins" hidden></span>
    <button id="help" class="icon" type="button" aria-label="Help">?</button>
  </header>

  <section id="home">
    <ul id="stories" class="stories"></ul>
  </section>

  <section id="play" hidden>
    <div id="scene-wrap">
      <div id="scene"></div>
      <p id="bubble" class="bubble" hidden></p>
      <button id="debug-zone" type="button" aria-hidden="true" tabindex="-1"></button>
    </div>
    <div id="paper" class="paper" hidden>
      <p id="written" class="written"></p>
      <p id="coin-change" class="coin-change" hidden></p>
      <ul id="errors" class="errors"></ul>
      <p id="hint" class="hint" hidden></p>
    </div>
    <p id="stars" class="stars" hidden></p>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="next" class="primary" type="button" hidden></button>
    <div class="controls">
      <label id="camera" class="camera" for="photo" aria-label="Take a photo" title="Take a photo">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </label>
      <input id="photo" type="file" accept="image/*" hidden>
    </div>
    <p id="notice" class="notice" hidden></p>
  </section>

  <section id="log-view" hidden>
    <h2 data-t="log">Log</h2>
    <ul id="log-list" class="log"></ul>
    <button id="log-clear" class="ghost" type="button" data-t="clearLog">Clear log</button>
  </section>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="sheet-card">
      <h2 id="help-title" data-t="help">Help</h2>
      <button id="replay" class="ghost big" type="button" data-t="replay">Watch the tutorial again</button>
      <div class="row between">
        <span data-t="language">Language</span>
        <div class="lang" role="group">
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="es">Español</button>
        </div>
      </div>
      <label class="row between"><span data-t="age">Age</span><input id="age" type="number" min="4" max="12" inputmode="numeric"></label>
      <p id="tier" class="muted small"></p>
      <button id="show-log" class="ghost big" type="button" data-t="log">Log</button>
      <div id="settings">
        <p class="muted small" data-t="keyHelp">Only for the web version. Inside Claude, no key is needed.</p>
        <button type="button" class="ghost big" data-open-in-claude="word-quest" data-t="openInClaude">Open in Claude</button>
        <label><span data-t="keyLabel">API key (web only)</span>
          <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
        </label>
        <div class="row gap">
          <button id="key-save" class="primary" type="button" data-t="keySave">Save</button>
          <button id="key-forget" class="ghost" type="button" data-t="keyForget">Forget key</button>
        </div>
        <p id="key-status" class="muted small" role="status"></p>
      </div>
      <button id="close-sheet" class="primary big" type="button" data-t="close">Close</button>
    </div>
  </div>

  <div id="debug" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-card">
      <h2 data-t="debugTitle">Type a sentence</h2>
      <textarea id="debug-text" rows="3"></textarea>
      <div class="row gap">
        <button id="debug-run" class="primary" type="button" data-t="run">Run</button>
        <button id="debug-cancel" class="ghost" type="button" data-t="cancel">Cancel</button>
      </div>
    </div>
  </div>

  <footer class="muted small">Word Quest v1 · build __BUILD__ · © 2026 keymon-labs · <a href="https://github.com/keymon-labs/keymon-labs.github.io/blob/main/NOTICE.md" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a></footer>
</main>
<script type="module" src="./web.js"></script>
</body>
</html>
