<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano Jump</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Music&display=swap">
<style>
/* Layout: full-width game stage (canvas + HUD + overlays), single bright "storybook sky" look in any theme */
:root{
  --sky:#bfe4ff; --ink:#1c2a4a; --muted:#56658a; --paper:#ffffff;
  --accent:#ff6b3d; --grass:#5cbf4a; --gold:#ffbf1f; --bad:#e8434f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#8fcdf7;color:var(--ink);font:16px/1.45 system-ui,sans-serif;
  padding:12px max(12px,env(safe-area-inset-left)) 12px max(12px,env(safe-area-inset-right))}
#stage{position:relative;max-width:1200px;margin:0 auto;border-radius:18px;overflow:hidden;
  box-shadow:0 10px 30px rgba(28,42,74,.25);background:var(--sky);touch-action:manipulation}
canvas{display:block;width:100%}
.hud{position:absolute;inset:10px 10px auto 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.chip{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 14px;font:700 17px var(--display);
  display:flex;gap:6px;align-items:center;box-shadow:0 2px 0 rgba(28,42,74,.12)}
.chip.time.low{background:var(--bad);color:#fff}
.hud .spacer{flex:1}
.hud button{pointer-events:auto}
button{font:700 16px var(--display);border:0;border-radius:12px;padding:9px 16px;cursor:pointer;
  background:var(--paper);color:var(--ink);box-shadow:0 3px 0 rgba(28,42,74,.18)}
button.go{background:var(--accent);color:#fff;box-shadow:0 3px 0 #c44a22}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:active{transform:translateY(2px);box-shadow:none}
.overlay{position:absolute;inset:0;display:flex;background:rgba(28,42,74,.35);padding:16px;overflow:auto}
.panel{margin:auto;background:var(--paper);border-radius:20px;padding:20px 22px;width:min(560px,100%);display:grid;gap:14px;
  box-shadow:0 8px 0 rgba(28,42,74,.2)}
.panel h1,.panel h2{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
.panel h1{font-size:clamp(34px,6vw,46px);font-weight:800;color:var(--accent)}
.panel h2{font-size:30px;font-weight:800}
.panel p{margin:0;color:var(--muted)}
.songs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.songs label{display:block;border:2px solid #dbe5f3;border-radius:14px;padding:8px 12px;cursor:pointer;font:700 17px var(--display)}
.songs label small{display:block;font:500 13px system-ui,sans-serif;color:var(--muted)}
.songs input{position:absolute;opacity:0}
.songs input:checked+label{border-color:var(--accent);background:#fff2ec}
.songs input:focus-visible+label{outline:3px solid var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opts label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:grid;gap:3px}
select{font:600 15px system-ui,sans-serif;padding:7px 8px;border-radius:10px;border:2px solid #dbe5f3;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.conn{font-size:13.5px;color:var(--muted)}
.conn b{color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c3ccda;margin-right:6px}
.dot.on{background:var(--grass)}
.big-stars{font:800 40px var(--display);color:var(--gold);letter-spacing:.05em}
@media (max-width:520px){.chip{font-size:15px;padding:3px 10px}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="Piano Jump game"></canvas>

  <div class="hud">
    <span class="chip" id="hSong">Piano Jump</span>
    <span class="chip">★ <span id="hStars">0</span></span>
    <span class="chip time" id="hTimeChip">⏱ <span id="hTime">–</span></span>
    <span class="spacer"></span>
    <span class="chip" style="font-size:13px"><span class="dot" id="hDot"></span><span id="hInput">No piano</span></span>
    <button id="btnMenu" aria-label="Menu">Menu</button>
  </div>

  <div class="overlay" id="ovMenu">
    <div class="panel">
      <h1>Piano Jump</h1>
      <p style="font-size:13px">Version 1 · <a href="https://keymon-labs.github.io/#piano-jump" style="color:inherit">other versions</a></p>
      <p>Play the right note and the egg jumps to the next stone. Play in time for a star. Catch the flying clocks for extra seconds.</p>
      <div class="songs" id="songList"></div>
      <div class="opts">
        <label>Speed<select id="oTempo"><option value="0.7">Slow</option><option value="0.85" selected>Medium</option><option value="1">Song speed</option></select></label>
        <label>Note names<select id="oNames"><option value="letters">C D E</option><option value="solfege">Do Re Mi</option><option value="next">Next note only</option><option value="none">Hidden</option></select></label>
        <label>When you fall<select id="oFail"><option value="ask">Ask me</option><option value="retry">Try the note again</option><option value="restart">Start over</option></select></label>
        <label>Clock<select id="oClock"><option value="on">On</option><option value="off">Off</option></select></label>
        <label>Octave<select id="oOct"><option value="exact">Exact key</option><option value="any">Any C, any D…</option></select></label>
        <label>Sounds<select id="oSfx"><option value="on">On</option><option value="off">Off</option></select></label>
      </div>
      <div class="row">
        <button id="btnBle">Connect Bluetooth</button>
        <button id="btnMidi">Connect MIDI / USB</button>
        <span class="conn" id="connText"><span class="dot"></span>No piano yet. Computer keys A S D F G H J K play C to C.</span>
      </div>
      <button class="go" id="btnStart" style="font-size:22px;padding:12px">Play!</button>
    </div>
  </div>

  <div class="overlay" id="ovFail" hidden style="background:rgba(28,42,74,.15)">
    <div class="panel" style="text-align:center;margin:auto auto 12px">
      <h2 id="failTitle">Oops!</h2>
      <p id="failMsg"></p>
      <p id="failHint" style="font:700 18px var(--display);color:var(--ink)"></p>
      <div class="row" style="justify-content:center" id="failBtns">
        <button class="go" id="btnRetry">Try this note again</button>
        <button id="btnRestart">Start from the beginning</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="ovWin" hidden>
    <div class="panel" style="text-align:center">
      <h2>You did it!</h2>
      <div class="big-stars" id="winStars"></div>
      <p id="winMsg"></p>
      <div class="row" style="justify-content:center">
        <button class="go" id="btnAgain">Play again</button>
        <button id="btnSongs">Pick a song</button>
      </div>
    </div>
  </div>
</div>

<script>
// ================= Songs =================
// [note, beats, lyric]
const SONGS=[
 {id:"humpty",title:"Humpty Dumpty",info:"3/4 · both hands",bpm:100,bar:3,notes:[
  ["C4",2,"Hump"],["D4",1,"ty"],["E4",2,"Dump"],["D4",1,"ty"],["C4",1,"sat"],["D4",1,"on"],["E4",1,"a"],["F4",3,"wall."],
  ["F3",2,"Hump"],["E3",1,"ty"],["D3",2,"Dump"],["E3",1,"ty"],["F3",1,"had"],["E3",1,"a"],["D3",1,"great"],["C3",3,"fall!"]]},
 {id:"hcb",title:"Hot Cross Buns",info:"4/4 · C D E",bpm:96,bar:4,notes:[
  ["E4",1,"Hot"],["D4",1,"cross"],["C4",2,"buns,"],["E4",1,"hot"],["D4",1,"cross"],["C4",2,"buns,"],
  ["C4",.5,"one"],["C4",.5,"a"],["C4",.5,"pen"],["C4",.5,"ny,"],["D4",.5,"two"],["D4",.5,"a"],["D4",.5,"pen"],["D4",.5,"ny,"],
  ["E4",1,"hot"],["D4",1,"cross"],["C4",2,"buns!"]]},
 {id:"mary",title:"Mary Had a Little Lamb",info:"4/4 · C to G",bpm:100,bar:4,notes:[
  ["E4",1,"Ma"],["D4",1,"ry"],["C4",1,"had"],["D4",1,"a"],["E4",1,"lit"],["E4",1,"tle"],["E4",2,"lamb,"],
  ["D4",1,"lit"],["D4",1,"tle"],["D4",2,"lamb,"],["E4",1,"lit"],["G4",1,"tle"],["G4",2,"lamb,"],
  ["E4",1,"Ma"],["D4",1,"ry"],["C4",1,"had"],["D4",1,"a"],["E4",1,"lit"],["E4",1,"tle"],["E4",1,"lamb,"],["E4",1,"its"],
  ["D4",1,"fleece"],["D4",1,"was"],["E4",1,"white"],["D4",1,"as"],["C4",4,"snow."]]},
 {id:"twinkle",title:"Twinkle Twinkle",info:"4/4 · C to A",bpm:96,bar:4,notes:[
  ["C4",1,"Twin"],["C4",1,"kle"],["G4",1,"twin"],["G4",1,"kle"],["A4",1,"lit"],["A4",1,"tle"],["G4",2,"star,"],
  ["F4",1,"how"],["F4",1,"I"],["E4",1,"won"],["E4",1,"der"],["D4",1,"what"],["D4",1,"you"],["C4",2,"are."]]},
 {id:"ode",title:"Ode to Joy",info:"4/4 · Beethoven",bpm:100,bar:4,notes:[
  ["E4",1],["E4",1],["F4",1],["G4",1],["G4",1],["F4",1],["E4",1],["D4",1],
  ["C4",1],["C4",1],["D4",1],["E4",1],["E4",1.5],["D4",.5],["D4",2],
  ["E4",1],["E4",1],["F4",1],["G4",1],["G4",1],["F4",1],["E4",1],["D4",1],
  ["C4",1],["C4",1],["D4",1],["E4",1],["D4",1.5],["C4",.5],["C4",2]]}
];

// ================= Music helpers =================
const NAMES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const SOL=["Do","Do♯","Re","Re♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
const LETTER_IDX=[0,0,1,1,2,3,3,4,4,5,5,6];
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const toMidi=s=>{const m=/^([A-G])(#?)(-?\d)$/.exec(s);return 12*(+m[3]+1)+SEMI[m[1]]+(m[2]?1:0);};
const stepOf=m=>(Math.floor(m/12)-5)*7+LETTER_IDX[m%12];   // middle C = 0, one step per line/space
const sharpOf=m=>[1,3,6,8,10].includes(m%12);
const label=m=>(opts.names==="solfege"?SOL:NAMES)[m%12];

// ================= Settings =================
const opts={tempo:.85,names:"letters",fail:"ask",clock:"on",oct:"exact",sfx:"on",song:"humpty"};
try{Object.assign(opts,JSON.parse(localStorage.getItem("pianojump")||"{}"));}catch(e){}
const saveOpts=()=>{try{localStorage.setItem("pianojump",JSON.stringify(opts));}catch(e){}};
const $=id=>document.getElementById(id);
const sel={oTempo:"tempo",oNames:"names",oFail:"fail",oClock:"clock",oOct:"oct",oSfx:"sfx"};
for(const [id,k] of Object.entries(sel)){$(id).value=String(opts[k]);
  $(id).onchange=e=>{opts[k]=k==="tempo"?+e.target.value:e.target.value;saveOpts();};}
$("songList").innerHTML=SONGS.map(s=>`<div><input type="radio" name="song" id="s_${s.id}" value="${s.id}" ${s.id===opts.song?"checked":""}><label for="s_${s.id}">${s.title}<small>${s.info}</small></label></div>`).join("");
document.querySelectorAll('input[name=song]').forEach(r=>r.onchange=()=>{opts.song=r.value;saveOpts();});

// ================= Sound effects =================
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==="suspended")ac.resume();}
function tone(f,d,type="triangle",g=.12,delay=0,slide){if(!ac||opts.sfx!=="on")return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(v).connect(ac.destination);o.start(t);o.stop(t+d+.02);}
const sfx={
  star(){tone(1319,.12,"sine",.08);tone(1568,.18,"sine",.08,.07);},
  clock(){[880,1109,1319,1760].forEach((f,i)=>tone(f,.12,"square",.04,i*.06));},
  fall(){tone(500,.7,"sawtooth",.05,0,90);},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.1,i*.12));}
};

// ================= Canvas & geometry =================
const cv=$("cv"),ctx=cv.getContext("2d");
let W=0,H=0,S=10,CY=0,dpr=1;
function resize(){
  const w=$("stage").clientWidth,h=w<700?Math.max(420,Math.round(innerHeight*.75)):Math.max(340,Math.min(Math.round(innerHeight*.8),580,Math.round(w*.62)));
  dpr=Math.min(2,devicePixelRatio||1);cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+"px";W=w;H=h;
  S=H/34;CY=H*.53;if(song)layout();
}
const yOf=step=>CY-step*S;

// ================= Game state =================
let song,plats=[],startPlat,idx=0,state="menu",stars=0,timeLeft=0,clockRunning=false,tPrev=null,retried=false;
let ch={x:0,y:0,squash:0},jump=null,vy=0,camX=0,ghost=null,floats=[],confetti=[],failInfo=null,lastNoteT=0,autoTimer=0;
const beatSec=()=>60/(song.bpm*opts.tempo);
const headX=p=>p.x+S*1.7;
const landX=p=>p.x+Math.max(p.w*.62,S*4.2);

function layout(){
  const gap=S*4;let x=S*17;
  startPlat={x:S*8.5,w:x-gap-S*8.5,top:0,step:stepOf(plats[0].midi)};
  startPlat.top=yOf(startPlat.step)+S*1.05;
  let beats=0;
  for(const p of plats){p.x=x;p.w=S*5.2+p.dur*S*4.4;p.top=yOf(p.step)+S*1.05;p.bar=beats>0&&Math.abs(beats%song.bar)<1e-6;beats+=p.dur;x+=p.w+gap;}
  layout.gap=gap;layout.end=x;
  const at=idx>0?plats[idx-1]:startPlat;if(!jump&&state!=="falling"){ch.x=at===startPlat?at.x+at.w*.6:landX(at);ch.y=at.top;}
}
function loadSong(){
  song=SONGS.find(s=>s.id===opts.song)||SONGS[0];
  plats=song.notes.map(([n,d,l],i)=>({midi:toMidi(n),dur:d,lyric:l||"",step:stepOf(toMidi(n)),star:false,
    clock:i>=2&&(i%5===3),got:false}));
  idx=0;stars=0;tPrev=null;retried=false;jump=null;ghost=null;floats=[];confetti=[];
  timeLeft=plats.reduce((a,p)=>a+p.dur,0)*beatSec()*2.2+12;clockRunning=false;
  layout();camX=0;$("hSong").textContent=song.title;updateHud();
}
function updateHud(){
  $("hStars").textContent=`${stars} / ${plats.length}`;
  const on=opts.clock==="on";$("hTimeChip").hidden=!on;
  if(on){$("hTime").textContent=Math.max(0,Math.ceil(timeLeft))+"s";$("hTimeChip").classList.toggle("low",timeLeft<8);}
}
function float(text,x,y,color="#1c2a4a"){floats.push({text,x,y,t:0,color});}

// ================= Note handling =================
function matches(m,target){return opts.oct==="any"?m%12===target%12:m===target;}
function pitchDiff(m,target){
  if(opts.oct!=="any")return m-target;
  let d=((m-target)%12+12)%12;return d>6?d-12:d;
}
function onNote(m){
  const now=performance.now()/1000;
  if(now-lastNoteT<.08)return;lastNoteT=now;
  if(state==="fail"){const t=plats[idx];if(t&&matches(m,t.midi)){retryNote();}else return;}
  if(state!=="play")return;
  if(jump)finishJump();
  if(state!=="play")return;
  const t=plats[idx];if(!t)return;
  if(matches(m,t.midi)){
    let rating="free";
    if(tPrev!==null){
      const exp=tPrev+plats[idx-1].dur*beatSec(),err=now-exp,tol=Math.max(.16,.35*beatSec());
      rating=Math.abs(err)<=tol?"good":(err<0?"early":"late");
    }
    if(rating==="good"||(rating==="free"&&!retried)){t.star=true;stars++;sfx.star();float("★",landX(t),t.top-S*6,"#ffbf1f");}
    else if(rating==="early")float("a bit early",landX(t),t.top-S*6);
    else if(rating==="late")float("a bit late",landX(t),t.top-S*6);
    if(t.clock&&!t.got&&rating==="good"&&opts.clock==="on"){t.got=true;timeLeft+=6;sfx.clock();float("+6s",landX(t),t.top-S*9,"#ff6b3d");}
    if(opts.clock==="on")clockRunning=true;
    tPrev=now;retried=false;idx++;
    startJump(landX(t),t.top,()=>{if(idx>=plats.length)win();});
  }else{
    const short=pitchDiff(m,t.midi)<0;
    failInfo={played:m,want:t.midi,short,reason:short?"short":"long"};
    ghost={midi:m,x:headX(t)+S*3.2,t:now};
    const lx=short?t.x-layout.gap*.5:t.x+t.w+layout.gap*.5;
    startJump(lx,t.top,()=>{state="falling";vy=0;sfx.fall();},true);
  }
  updateHud();
}
function startJump(x1,y1,done,wrong){
  const dx=Math.abs(x1-ch.x),rise=Math.max(0,ch.y-y1);
  jump={x0:ch.x,y0:ch.y,x1,y1,t:0,d:Math.min(.5,.28+dx/(S*90)),peak:S*2.6+rise*.9+dx*.08,done,wrong};
}
function finishJump(){const j=jump;jump=null;ch.x=j.x1;ch.y=j.y1;if(!j.wrong)ch.squash=1;j.done();}
function retryNote(){
  hide("ovFail");clearTimeout(autoTimer);
  const at=idx>0?plats[idx-1]:startPlat;ch.x=at===startPlat?at.x+at.w*.6:landX(at);ch.y=at.top;
  jump=null;ghost=null;state="play";tPrev=null;retried=true;if(opts.clock==="on")timeLeft=Math.max(timeLeft,15);updateHud();
}
function restart(){hide("ovFail");hide("ovWin");clearTimeout(autoTimer);loadSong();state="play";}
function showFail(){
  state="fail";const f=failInfo;
  if(f.reason==="time"){$("failTitle").textContent="Time's up!";$("failMsg").textContent="Catch the flying clocks to get more time.";}
  else{$("failTitle").textContent=f.short?"Too short!":"Too long!";
    $("failMsg").textContent=`You played ${label(f.played)}. This note is ${label(f.want)}${f.short?", a bit higher":", a bit lower"}.`;}
  $("failHint").textContent=`Play ${label(plats[idx].midi)} to try again`;
  if(opts.fail==="ask"){$("failBtns").hidden=false;show("ovFail");}
  else{$("failBtns").hidden=true;show("ovFail");autoTimer=setTimeout(()=>opts.fail==="retry"?retryNote():restart(),1600);
    $("failHint").textContent=opts.fail==="retry"?"Try that note again…":"Back to the start…";}
}
function win(){
  state="win";clockRunning=false;sfx.win();
  for(let i=0;i<90;i++)confetti.push({x:ch.x+(Math.random()-.5)*W*.6,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*60,vy:60+Math.random()*120,c:["#ff6b3d","#ffbf1f","#5cbf4a","#4aa3ff","#c86bff"][i%5],r:Math.random()*6});
  setTimeout(()=>{$("winStars").textContent=`★ ${stars} / ${plats.length}`;
    $("winMsg").textContent=`${stars} of ${plats.length} notes in time`+(opts.clock==="on"?` · ${Math.ceil(timeLeft)}s left on the clock`:"")+".";
    show("ovWin");},1200);
}
const show=id=>$(id).hidden=false,hide=id=>$(id).hidden=true;

// ================= Update & draw =================
let last=performance.now();
function frame(nowMs){
  const dt=Math.min(.05,(nowMs-last)/1000);last=nowMs;const now=nowMs/1000;
  if(jump){jump.t+=dt;const u=Math.min(1,jump.t/jump.d);
    ch.x=jump.x0+(jump.x1-jump.x0)*u;ch.y=jump.y0+(jump.y1-jump.y0)*u-jump.peak*4*u*(1-u);if(u>=1)finishJump();}
  if(state==="falling"){vy+=S*160*dt;ch.y+=vy*dt;if(ch.y>H+S*6){showFail();}}
  if(state==="play"&&clockRunning&&opts.clock==="on"){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;jump&&finishJump();failInfo={reason:"time"};sfx.fall();showFail();}
    if(Math.ceil(timeLeft)!==Math.ceil(timeLeft+dt))updateHud();}
  ch.squash=Math.max(0,ch.squash-dt*5);
  const target=Math.max(0,ch.x-W*.33);camX+=(target-camX)*Math.min(1,dt*5);
  floats=floats.filter(f=>(f.t+=dt)<1.3);
  for(const c of confetti){c.vy+=30*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=dt*6;}
  draw(now);requestAnimationFrame(frame);
}

function draw(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#9ad6ff");g.addColorStop(1,"#e4f5ff");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // drifting clouds
  ctx.fillStyle="rgba(255,255,255,.75)";
  for(let i=0;i<6;i++){const cx=((i*W*.37-camX*.25)%(W*1.6)+W*1.6)%(W*1.6)-W*.3,cy=H*(.08+.05*(i%3));cloud(cx,cy,S*(2+i%3));}
  // staff (screen-wide)
  ctx.strokeStyle="rgba(28,42,74,.55)";ctx.lineWidth=Math.max(1,S*.12);
  for(const st of [2,4,6,8,10,-2,-4,-6,-8,-10]){ctx.beginPath();ctx.moveTo(0,yOf(st));ctx.lineTo(W,yOf(st));ctx.stroke();}
  ctx.save();ctx.translate(-camX,0);
  // bar lines
  ctx.strokeStyle="rgba(28,42,74,.55)";
  for(const p of plats)if(p.bar){const bx=p.x-layout.gap*.5;ctx.beginPath();ctx.moveTo(bx,yOf(10));ctx.lineTo(bx,yOf(-10));ctx.stroke();}
  const ex=layout.end-layout.gap*.5;ctx.lineWidth=S*.5;ctx.beginPath();ctx.moveTo(ex+S*.6,yOf(10));ctx.lineTo(ex+S*.6,yOf(-10));ctx.stroke();
  ctx.lineWidth=S*.15;ctx.beginPath();ctx.moveTo(ex-S*.3,yOf(10));ctx.lineTo(ex-S*.3,yOf(-10));ctx.stroke();
  // time signature
  ctx.fillStyle="#1c2a4a";ctx.font=`800 ${S*4.2}px "Baloo 2",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
  const tsx=S*13.2;
  for(const st of [8,4,-4,-8])ctx.fillText(st===8||st===-4?song.bar:4,tsx,yOf(st)+S*.35);
  // platforms
  platform(startPlat,null);
  plats.forEach((p,i)=>platform(p,i));
  // goal flag
  const lp=plats[plats.length-1];const fx=lp.x+lp.w-S*1.2;
  ctx.strokeStyle="#1c2a4a";ctx.lineWidth=S*.35;ctx.beginPath();ctx.moveTo(fx,lp.top);ctx.lineTo(fx,lp.top-S*9);ctx.stroke();
  ctx.fillStyle="#ff6b3d";ctx.beginPath();const wv=Math.sin(now*6)*S*.6;ctx.moveTo(fx,lp.top-S*9);ctx.quadraticCurveTo(fx+S*2.5,lp.top-S*8.5+wv,fx+S*5,lp.top-S*7.6);ctx.lineTo(fx,lp.top-S*6.2);ctx.fill();
  // ghost (wrong) note
  if(ghost&&now-ghost.t<3){ctx.globalAlpha=Math.max(0,1-(now-ghost.t)/3);noteHead(ghost.x,stepOf(ghost.midi),1,"#e8434f",sharpOf(ghost.midi));
    ctx.fillStyle="#e8434f";ctx.font=`800 ${S*2}px "Baloo 2",sans-serif`;ctx.fillText(label(ghost.midi),ghost.x,yOf(stepOf(ghost.midi))-S*3);ctx.globalAlpha=1;}
  // flying clock
  const t=plats[idx];
  if(state==="play"&&t&&t.clock&&!t.got&&tPrev!==null&&opts.clock==="on"){
    const exp=tPrev+plats[idx-1].dur*beatSec(),bx=landX(t)-(now-exp)*S*14,by=t.top-S*9+Math.sin(now*4)*S*.6;bird(bx,by,now);}
  // timing ring
  if(state==="play"&&t&&tPrev!==null&&!jump){
    const exp=plats[idx-1].dur*beatSec(),u=(now-tPrev)/exp,tol=Math.max(.16,.35*beatSec())/exp;
    const cx=ch.x,cy=ch.y-S*7.6,r=S*1.3;
    ctx.lineWidth=S*.5;ctx.strokeStyle="rgba(28,42,74,.18)";ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
    const inWin=Math.abs(u-1)<=tol;ctx.strokeStyle=inWin?"#ffbf1f":u>1?"rgba(28,42,74,.3)":"#4aa3ff";
    ctx.beginPath();ctx.arc(cx,cy,inWin?r*1.25:r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,u));ctx.stroke();
    if(inWin){ctx.fillStyle="#ffbf1f";ctx.font=`800 ${S*1.8}px "Baloo 2",sans-serif`;ctx.fillText("★",cx,cy+S*.1);}
  }
  egg(ch.x,ch.y,now);
  // floats
  for(const f of floats){ctx.globalAlpha=1-f.t/1.3;ctx.fillStyle=f.color;ctx.font=`800 ${S*(f.text==="★"?3.2:2)}px "Baloo 2",sans-serif`;
    ctx.fillText(f.text,f.x,f.y-f.t*S*4);}ctx.globalAlpha=1;
  ctx.restore();

  const pw=S*7.6,pg=ctx.createLinearGradient(0,0,pw+S*2,0);pg.addColorStop(0,"rgba(228,245,255,1)");pg.addColorStop(.8,"rgba(228,245,255,.95)");pg.addColorStop(1,"rgba(228,245,255,0)");
  ctx.fillStyle=pg;ctx.fillRect(0,yOf(13),pw+S*2,yOf(-13)-yOf(13));
  ctx.strokeStyle="rgba(28,42,74,.55)";ctx.lineWidth=Math.max(1,S*.12);
  for(const st of [2,4,6,8,10,-2,-4,-6,-8,-10]){ctx.beginPath();ctx.moveTo(0,yOf(st));ctx.lineTo(pw+S*2,yOf(st));ctx.stroke();}
  ctx.lineWidth=S*.3;ctx.beginPath();ctx.moveTo(S*1.4,yOf(10));ctx.lineTo(S*1.4,yOf(-10));ctx.stroke();
  ctx.fillStyle="#1c2a4a";ctx.textAlign="left";ctx.textBaseline="alphabetic";
  ctx.font=`${S*8}px "Noto Music",serif`;ctx.fillText("\u{1D11E}",S*2.6,yOf(4));
  ctx.font=`${S*8}px "Noto Music",serif`;ctx.fillText("\u{1D122}",S*2.6,yOf(-6));
  ctx.textAlign="center";
  // confetti
  for(const c of confetti){ctx.save();ctx.translate(c.x-camX,c.y);ctx.rotate(c.r);ctx.fillStyle=c.c;ctx.fillRect(-4,-2,8,4);ctx.restore();}
}
function cloud(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.arc(x+r,y-r*.4,r*1.2,0,7);ctx.arc(x+r*2.1,y,r*.9,0,7);ctx.fill();}
function platform(p,i){
  const isStart=i===null,done=!isStart&&i<idx,next=i===idx;
  // stone block
  const top=p.top,h=S*2.6;
  ctx.fillStyle=done?"#b8a48c":"#9b8064";roundRect(p.x,top,p.w,h,S*.8);ctx.fill();
  ctx.fillStyle=next?"#ffcf3a":"#5cbf4a";roundRect(p.x-S*.2,top-S*.25,p.w+S*.4,S*1.1,S*.55);ctx.fill();
  if(isStart)return;
  noteHead(headX(p),p.step,p.dur,done?"rgba(28,42,74,.45)":"#1c2a4a",false);
  // star earned
  if(p.star){ctx.fillStyle="#ffbf1f";ctx.font=`800 ${S*1.9}px "Baloo 2",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("★",p.x+p.w-S*1.4,top+S*1.4);}
  // label
  const showL=opts.names==="letters"||opts.names==="solfege"||(opts.names==="next"&&next);
  if(showL&&!done){const lx=headX(p),ly=yOf(p.step)-S*3.6,txt=label(p.midi);
    ctx.font=`800 ${S*(next?2.2:1.7)}px "Baloo 2",sans-serif`;const tw=ctx.measureText(txt).width+S*1.4;
    ctx.fillStyle=next?"#ff6b3d":"rgba(255,255,255,.9)";roundRect(lx-tw/2,ly-S*1.3,tw,S*2.6,S*1.3);ctx.fill();
    ctx.fillStyle=next?"#fff":"#1c2a4a";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,lx,ly+S*.15);}
  // lyric
  if(p.lyric){ctx.fillStyle=done?"rgba(28,42,74,.4)":"#1c2a4a";ctx.font=`700 ${S*1.6}px "Baloo 2",sans-serif`;ctx.textAlign="left";ctx.textBaseline="top";ctx.fillText(p.lyric,p.x+S*.4,top+h+S*.5);}
}
function noteHead(x,step,dur,color,sharp){
  const y=yOf(step);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=Math.max(1.2,S*.18);
  // ledger lines
  const led=[];if(step===0||step===1||step===-1)led.push(0);
  for(let s=12;s<=step;s+=2)led.push(s);for(let s=-12;s>=step;s-=2)led.push(s);
  for(const s of led){ctx.beginPath();ctx.moveTo(x-S*2,yOf(s));ctx.lineTo(x+S*2,yOf(s));ctx.stroke();}
  ctx.save();ctx.translate(x,y);ctx.rotate(-.35);ctx.beginPath();ctx.ellipse(0,0,S*1.3,S*.9,0,0,7);
  if(dur>=2){ctx.lineWidth=S*.42;ctx.stroke();}else ctx.fill();ctx.restore();
  if(dur<4){ctx.lineWidth=Math.max(1.2,S*.2);ctx.beginPath();ctx.moveTo(x+S*1.15,y-S*.2);ctx.lineTo(x+S*1.15,y-S*7);ctx.stroke();}
  if(dur===.5||dur===1.5&&false){ctx.beginPath();ctx.moveTo(x+S*1.15,y-S*7);ctx.quadraticCurveTo(x+S*3.2,y-S*5,x+S*2.4,y-S*3);ctx.stroke();}
  if(dur===3||dur===1.5){ctx.beginPath();ctx.arc(x+S*2.3,y-(step%2===0?S*.9:0),S*.38,0,7);ctx.fill();}
  if(sharp){ctx.font=`800 ${S*2.4}px "Baloo 2",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("♯",x-S*2.6,y);}
}
function egg(x,y,now){
  const sq=ch.squash,falling=state==="falling",w=S*2.5*(1+sq*.25),h=S*3.4*(1-sq*.2);
  ctx.save();ctx.translate(x,y);if(falling)ctx.rotate(Math.sin(now*12)*.4);
  // legs
  ctx.strokeStyle="#1c2a4a";ctx.lineWidth=S*.35;ctx.lineCap="round";
  const step=jump?.6:Math.sin(now*3)*.1;
  ctx.beginPath();ctx.moveTo(-w*.3,-S*.9);ctx.lineTo(-w*.35-step*S,0);ctx.moveTo(w*.3,-S*.9);ctx.lineTo(w*.35+step*S,0);ctx.stroke();
  // body
  ctx.fillStyle="#fffdf6";ctx.strokeStyle="#1c2a4a";ctx.lineWidth=S*.28;
  ctx.beginPath();ctx.ellipse(0,-S*.8-h/2,w/2,h/2,0,0,7);ctx.fill();ctx.stroke();
  // belt
  ctx.save();ctx.beginPath();ctx.ellipse(0,-S*.8-h/2,w/2,h/2,0,0,7);ctx.clip();ctx.fillStyle="#4aa3ff";ctx.fillRect(-w,-S*.8-h*.42,w*2,S*.7);ctx.restore();
  // face
  const fy=-S*.8-h*.68;ctx.fillStyle="#1c2a4a";
  ctx.beginPath();ctx.arc(-w*.17,fy,S*.28,0,7);ctx.arc(w*.17,fy,S*.28,0,7);ctx.fill();
  ctx.beginPath();ctx.lineWidth=S*.22;if(falling)ctx.arc(0,fy+S*.9,S*.35,0,7);else ctx.arc(0,fy+S*.35,S*.5,.2,Math.PI-.2);ctx.stroke();
  ctx.restore();
}
function bird(x,y,now){
  const f=Math.sin(now*14)*S*.9;ctx.fillStyle="#c86bff";ctx.strokeStyle="#1c2a4a";ctx.lineWidth=S*.2;
  ctx.beginPath();ctx.moveTo(x-S*.4,y);ctx.lineTo(x-S*2.4,y-f);ctx.lineTo(x-S*1.2,y+S*.5);ctx.fill();
  ctx.beginPath();ctx.moveTo(x+S*.4,y);ctx.lineTo(x+S*2.4,y-f);ctx.lineTo(x+S*1.2,y+S*.5);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y+S*.4,S*1.3,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y+S*.4);ctx.lineTo(x,y-S*.4);ctx.moveTo(x,y+S*.4);ctx.lineTo(x+S*.6,y+S*.6);ctx.stroke();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ================= Input: Web MIDI, Web Bluetooth, keyboard =================
function setConn(name){$("hDot").className="dot on";$("hInput").textContent=name;
  $("connText").innerHTML=`<span class="dot on"></span><b>${name}</b> connected`;}
function connMsg(t){$("connText").innerHTML=`<span class="dot"></span>${t}`;}
function midiMsg(s,a,b){const t=s&0xF0;if(t===0x90&&b>0)onNote(a);}
$("btnMidi").onclick=async()=>{
  audio();
  if(!navigator.requestMIDIAccess)return connMsg("No Web MIDI in this browser. Use Chrome or Edge.");
  try{const acc=await navigator.requestMIDIAccess();
    const bind=()=>{const ins=[...acc.inputs.values()];ins.forEach(i=>i.onmidimessage=e=>midiMsg(e.data[0],e.data[1],e.data[2]??0));
      ins.length?setConn(ins.map(i=>i.name).join(", ")):connMsg("MIDI ready, but no piano found. Plug in USB or pair it first.");};
    acc.onstatechange=bind;bind();
  }catch(e){connMsg("MIDI access was refused.");}
};
const BLE_SVC="03b80e5a-ede8-4b33-a751-6ce34ec4c700",BLE_CHR="7772e5db-3868-4112-a1a9-f2669d106bf3";
$("btnBle").onclick=async()=>{
  audio();
  if(!navigator.bluetooth)return connMsg("No Web Bluetooth in this browser. Use Chrome or Edge.");
  try{const dev=await navigator.bluetooth.requestDevice({filters:[{services:[BLE_SVC]}]});
    dev.addEventListener("gattserverdisconnected",()=>{$("hDot").className="dot";$("hInput").textContent="Piano disconnected";connMsg("Piano disconnected.");});
    const chr=await (await (await dev.gatt.connect()).getPrimaryService(BLE_SVC)).getCharacteristic(BLE_CHR);
    chr.addEventListener("characteristicvaluechanged",e=>parseBle(new Uint8Array(e.target.value.buffer)));
    await chr.startNotifications();setConn(dev.name||"Bluetooth piano");
  }catch(e){if(e.name!=="NotFoundError")connMsg("Bluetooth failed. Turn on Bluetooth MIDI on the piano and unpair it from other devices.");}
};
const dataLen=s=>{const t=s&0xF0;return(t===0xC0||t===0xD0)?1:(s>=0xF0?0:2);};
let run=0;
function parseBle(p){let i=1;while(i<p.length){let b=p[i];
  if(b&0x80){i++;if(i>=p.length)break;b=p[i];if(b&0x80){if(b>=0xF8){i++;continue;}if(b===0xF0)return;run=b;i++;}}
  if(!run){i++;continue;}const n=dataLen(run);if(i+n>p.length)break;midiMsg(run,p[i],n>1?p[i+1]:0);i+=n;}}
const KEYS={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72};
addEventListener("keydown",e=>{if(e.target.tagName==="SELECT"||e.metaKey||e.ctrlKey||e.repeat)return;
  let n=KEYS[e.key.toLowerCase()];if(n===undefined)return;if(e.shiftKey)n-=12;audio();onNote(n);});

// ================= Buttons =================
$("btnStart").onclick=()=>{audio();hide("ovMenu");loadSong();state="play";};
$("btnMenu").onclick=()=>{state="menu";clearTimeout(autoTimer);hide("ovFail");hide("ovWin");show("ovMenu");};
$("btnRetry").onclick=retryNote;$("btnRestart").onclick=restart;
$("btnAgain").onclick=restart;$("btnSongs").onclick=()=>{hide("ovWin");state="menu";show("ovMenu");};

addEventListener("resize",resize);
loadSong();resize();requestAnimationFrame(frame);
document.fonts?.ready.then(()=>{});
// expose for testing
window.__pj={onNote,get state(){return state},get idx(){return idx}};
</script>
