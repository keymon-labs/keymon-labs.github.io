<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>keymon-labs</title>
<meta name="description" content="Small web apps and experiments.">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1c1b19;--muted:#6b675f;--line:#e4e0d6;--accent:#c4562b}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1e1c;--text:#ecebe6;--muted:#9a968c;--line:#2e2c29;--accent:#e07a50}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(24px,env(safe-area-inset-top)) 16px 48px}
main{max-width:640px;margin:0 auto}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.lead{color:var(--muted);margin:0 0 28px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a.app{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:inherit;text-decoration:none}
a.app:active{transform:scale(.99)}
.app h2{font-size:18px;margin:0 0 4px}
.app p{margin:0;color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-top:8px}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:16px 18px}
footer{margin-top:40px;color:var(--muted);font-size:14px}
footer a{color:inherit}
</style>
</head>
<body>
<main>
<h1>keymon<span>-labs</span></h1>
<p class="lead">Small web apps and experiments, mostly built with Claude.</p>
<ul id="apps">
<!-- Add one <li> per app:
<li><a class="app" href="./app-name/"><h2>App name</h2><p>One-line description.</p><span class="tag">Chrome · mobile</span></a></li>
-->
<li class="empty">First app coming soon.</li>
</ul>
<footer>Source on <a href="https://github.com/keymon-labs/keymon-labs.github.io">GitHub</a>.</footer>
</main>
</body>
</html>
